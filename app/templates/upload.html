<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        .container {
            max-width: 640px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 18px;
            cursor: pointer;
        }
        .message {
            margin-top: 20px;
            padding: 12px;
            background: #f3f3f3;
            border-left: 4px solid #666;
        }
        a {
            display: inline-block;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <label for="account_name">帳號</label>
            <input
                type="text"
                id="account_name"
                name="account_name"
                placeholder="例如：Emily"
                required
            >

            <label for="file">交易 CSV</label>
            <input
                type="file"
                id="file"
                name="file"
                accept=".csv"
                required
            >

            <button type="submit">上傳</button>
        </form>

        {% if message %}
        <div class="message">
            {{ message }}
        </div>
        {% endif %}

        <a href="/">回首頁</a>
    </div>
</body>
</html>
