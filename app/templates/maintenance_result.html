<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; line-height: 1.6; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 8px; max-width: 700px; }
        .ok { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
        table { border-collapse: collapse; margin-top: 16px; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>

<h1>{{ title }}</h1>

<div class="box">
    <p>
        狀態：
        {% if success %}
            <span class="ok">成功</span>
        {% else %}
            <span class="error">失敗</span>
        {% endif %}
    </p>

    <table>
        <tr>
            <th>項目</th>
            <th>數值</th>
        </tr>

        {% for key, value in result.items() %}
        <tr>
            <td>{{ key }}</td>
            <td>{{ value }}</td>
        </tr>
        {% endfor %}
    </table>

    {% if message %}
    <p>{{ message }}</p>
    {% endif %}

    <p>
        <a href="/">返回首頁</a>
    </p>
</div>

</body>
</html>
