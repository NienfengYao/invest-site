<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; line-height: 1.5; }
        .container { max-width: 900px; }
        .box { border: 1px solid #ccc; padding: 16px; margin-bottom: 24px; border-radius: 8px; }
        input[type="text"] { padding: 8px; width: 280px; }
        button { padding: 8px 14px; cursor: pointer; }
        .message { margin-top: 12px; color: #b00020; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        a { text-decoration: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>{{ title }}</h1>

    <div class="box">
        <h2>新增帳戶</h2>
        <form action="/accounts" method="post">
            <input type="text" name="account_name" placeholder="例如：Emily" required>
            <button type="submit">新增</button>
        </form>
        {% if message %}
        <div class="message">{{ message }}</div>
        {% endif %}
    </div>

    <div class="box">
        <h2>帳戶列表</h2>
        {% if accounts %}
        <ul>
            {% for account in accounts %}
            <li>
                <a href="/accounts/{{ account.id }}">{{ account.name }}</a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>目前尚無帳戶</p>
        {% endif %}
    </div>
</div>
</body>
</html>
