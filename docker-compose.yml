version: "3.9"

services:
  invest-site:
    build: .
    container_name: invest-site
    ports:
      - "8000:8000"
    volumes:
      - ./app:/site/app
      - ./data:/site/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
